name: Bug report
description: Something in the plugin does not work as the documentation describes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, do not open an issue:
        see [SECURITY.md](https://github.com/Big-Dao/dsh-plugin-wsl-env/blob/main/SECURITY.md).
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in what you know; write "unknown" rather than guessing.
      value: |
        - Windows version:
        - WSL distro:
        - bubblewrap installed in the distro:
        - DSH version:
        - dsh-plugin-wsl-env version:
        - The session workspace (a distro path or a Windows path):
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The plugin's rows from `dsh --profile <name> --dump-config`.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        The command that failed and what it printed. Easiest first step:
        `pnpm run diagnose` (or `bash scripts/diagnose.sh`) collects the
        environment, the tools and a bwrap probe as one paste-ready report.
        When the sandbox is involved, the output of `npm run probe:sandbox`
        answers most of the remaining questions.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the Troubleshooting section of the README.
          required: true
        - label: I searched the existing issues for the same symptom.
          required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# corepack resolves pnpm from the packageManager field and downloads it once per
# runner; the flag silences its interactive download confirmation, which has no
# TTY in CI.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# What cannot run here, and why: `test/probe/` needs Windows, WSL2 with a distro,
# `bubblewrap` inside that distro, a harness profile and a linked checkout. A hosted
# runner has none of that, so the probes stay a manual step on the development
# machine (`pnpm run probe`, `probe:sandbox`, `probe:sandbox-shell`, `probe:terminal`,
# and inside the distro `probe:substrate`, `probe:watch`, `probe:agent`, `probe:exec`).
# See docs/RELEASING.md, and the archived record §16.6 for what that gap once cost.
jobs:
  test:
    name: unit (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The plugin runs on Windows and is developed inside a WSL distro, so the
        # path logic is exercised on both platform families. The Windows legs also
        # prove that the LF guarantee in .gitattributes holds on the platform whose
        # default is CRLF, which is what the shipped shell scripts depend on.
        #
        # Node 20 is absent on purpose: the harness host itself requires
        # ^22.19.0 || >=24.0.0, and pnpm 11 needs Node >= 22.13 — legs testing the
        # plugin on Node 20 would exercise a configuration no deployment reaches.
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # The 0.7.x tests import pinned dev dependencies: the composition and boot
      # tests run the loader's REAL patch algorithm (`@deepseek-ai/cordis-plugin-include`)
      # and `workspace-files-wsl` tests the service's pure builders against the
      # typert protocol shapes. `pnpm install --frozen-lockfile` reproduces the
      # locked tree; the runtime package itself still ships zero dependencies.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  coverage:
    name: coverage (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # The threshold flags need Node >= 22.8, so this runs on one version only.
      # It covers the pure modules. The integration layer (`lib/index.js`) is
      # covered by test/provider.test.mjs; `lib/picker.js`, `lib/auto-preset.js`
      # and `lib/shell-env.js` still belong to the probes.
      - run: pnpm run test:coverage

  # The native agent is a separate codebase (std-only Rust) with its own wire
  # behaviour; the plugin's Node suite never compiles it. This job builds the
  # spike from source, runs its manual suite against that build, then runs the
  # same suite against the binary committed in the package — the artifact the
  # host copies into a distro. The runner image already carries Rust; no new
  # action is needed.
  native:
    name: native spike (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build the spike
        run: cargo build --release --manifest-path agent/native/spike/Cargo.toml
      - name: Test the source-built binary
        run: node agent/native/spike/test.mjs agent/native/spike/target/release/dsh-wsl-agent-spike
      - name: Test the committed package binary
        run: node agent/native/spike/test.mjs agent/native/linux-x86_64/dsh-wsl-agent

  # The package must run on glibc (Ubuntu/Debian) and musl (Alpine) distros.
  # Static musl covers both: x86_64 links with the distro musl-gcc, aarch64
  # goes through cargo-zigbuild so one job can produce both. The artifacts are
  # downloaded and committed (the plugin has no build step on purpose).
  native-package:
    name: native packages (musl x86_64 + aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Rust targets and musl
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools python3-pip
      - name: Build x86_64 musl
        run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path agent/native/spike/Cargo.toml
      - name: Install zigbuild
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pip install --user ziglang
          cargo install cargo-zigbuild --locked
      - name: Build aarch64 musl
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cargo zigbuild --release --target aarch64-unknown-linux-musl --manifest-path agent/native/spike/Cargo.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test the x86_64 musl binary
        run: node agent/native/spike/test.mjs agent/native/spike/target/x86_64-unknown-linux-musl/release/dsh-wsl-agent-spike
      # The upload action is a tag rather than a SHA because the artifact is a
      # short-lived CI transport, not shipped code; the shipped bytes are the
      # committed binaries after review.
      - uses: actions/upload-artifact@v4
        with:
          name: native-package
          path: |
            agent/native/spike/target/x86_64-unknown-linux-musl/release/dsh-wsl-agent-spike
            agent/native/spike/target/aarch64-unknown-linux-musl/release/dsh-wsl-agent-spike
          if-no-files-found: error

  # The real-machine probes need Windows + WSL2 + the harness app, which no
  # hosted runner has. This job exists for a SELF-HOSTED Windows runner (the
  # development machine): dispatch it from the Actions tab there. On a hosted
  # runner every probe reports skipped and the job stays green, so the branch
  # protection on `main` can require this job without stranding PRs.
  probes:
    name: real-machine probes (self-hosted Windows)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # sandbox.sh needs bubblewrap in the default distro but no harness; the
      # rest need the app. A missing prerequisite reports skipped instead of
      # failing: the job's value is on the machines that have the topology.
      - name: Run the probes this machine can run
        run: |
          set -u
          APP="$LOCALAPPDATA/Programs/DeepSeek Harness"
          run_or_skip() {
            local name="$1" prereq="$2" script="$3"
            if [ "$prereq" = "none" ] || [ -x "$APP/DeepSeek Harness.exe" ]; then
              echo "::group::probe:$name"
              bash "test/probe/$script" || { echo "::endgroup::"; exit 1; }
              echo "::endgroup::"
            else
              echo "skip probe:$name (no harness app at $APP — configure it or dispatch on the dev machine)"
            fi
          }
          command -v wsl.exe >/dev/null 2>&1 || { echo "skip all (no WSL on this runner)"; exit 0; }
          run_or_skip sandbox none sandbox.sh
          run_or_skip mode harness mode.sh
          run_or_skip terminal harness terminal.sh
          run_or_skip picker harness picker.sh
          run_or_skip missing-wsl harness missing-wsl.sh

name: Cloud WSL Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-wsl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-plugin:
    name: Harness CLI, plugin, and WSL
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: corepack enable pnpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Ubuntu 24.04 and probe packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & wsl.exe --install -d Ubuntu-24.04 --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu install failed: exit=$LASTEXITCODE" }
          & wsl.exe --set-default Ubuntu-24.04
          if ($LASTEXITCODE -ne 0) { throw "default distro selection failed: exit=$LASTEXITCODE" }
          & wsl.exe -d Ubuntu-24.04 -u root --exec apt-get update
          if ($LASTEXITCODE -ne 0) { throw "apt-get update failed: exit=$LASTEXITCODE" }
          & wsl.exe -d Ubuntu-24.04 -u root --exec apt-get install -y --no-install-recommends bubblewrap git ca-certificates curl
          if ($LASTEXITCODE -ne 0) { throw "probe package install failed: exit=$LASTEXITCODE" }

      - name: Install Harness and local plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes @deepseek-ai/dsh@0.2.2-rc.5 --version
          if ($LASTEXITCODE -ne 0) { throw "Harness CLI installation or startup failed" }

          $workspace = (Resolve-Path "${{ github.workspace }}").Path
          & npx --yes @deepseek-ai/dsh@0.2.2-rc.5 plugin --profile cloud-wsl add "link:$workspace"
          if ($LASTEXITCODE -ne 0) { throw "local plugin installation failed" }

          $dump = & npx --yes @deepseek-ai/dsh@0.2.2-rc.5 --profile cloud-wsl --dump-config
          if ($LASTEXITCODE -ne 0) { throw "cloud-wsl profile dump failed" }
          $dumpText = $dump -join "`n"
          Set-Content -Path "cloud-wsl-profile.txt" -Value $dumpText
          if (-not $dumpText.Contains("dsh-plugin-wsl-env")) {
            throw "dumped profile does not contain dsh-plugin-wsl-env"
          }

      - name: Boot Harness Web UI with plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:GITHUB_WORKSPACE "cloud-wsl-web.stdout.txt"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "cloud-wsl-web.stderr.txt"
          $process = Start-Process -FilePath "npx.cmd" `
            -ArgumentList @("--yes", "@deepseek-ai/dsh@0.2.2-rc.5", "--profile", "cloud-wsl", "web", "--no-open", "--host", "127.0.0.1", "--port", "3080") `
            -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                throw "Harness Web UI exited before readiness (exit=$($process.ExitCode))"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:3080/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              throw "Harness Web UI did not become ready"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Exercise bwrap workspace fence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = wsl.exe -d Ubuntu-24.04 --exec wslpath -u "${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { throw "workspace translation failed: exit=$LASTEXITCODE" }
          $workspace = $workspace.TrimEnd("`r", "`n")
          $script = @(
            "set -eu",
            "cd '$workspace'",
            "mkdir -p .cloud-wsl-gate",
            "printf pass > .cloud-wsl-gate/inside.txt",
            "bwrap --ro-bind / / --dev /dev --proc /proc --die-with-parent --bind '$workspace' '$workspace' -- sh -c 'printf pass > $workspace/.cloud-wsl-gate/bwrap.txt'",
            "grep -qx pass '$workspace/.cloud-wsl-gate/inside.txt'",
            "grep -qx pass '$workspace/.cloud-wsl-gate/bwrap.txt'",
            "rm -rf '$workspace/.cloud-wsl-gate'"
          ) -join "`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          & wsl.exe -d Ubuntu-24.04 --exec bash -lc "echo '$encoded' | base64 -d | bash"
          if ($LASTEXITCODE -ne 0) { throw "bwrap workspace fence failed" }

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-wsl-gate-${{ github.run_id }}
          path: |
            cloud-wsl-profile.txt
            cloud-wsl-web.stdout.txt
            cloud-wsl-web.stderr.txt
          if-no-files-found: ignore

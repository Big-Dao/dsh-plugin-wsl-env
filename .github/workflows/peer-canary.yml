# Peer-upgrade canary (WSL-209): the plugin's peerDependencies are floors, so a
# newer harness line installs without a plugin release — but a floor is only as
# good as its last verification.
#
# Weekly (and on demand) it resolves the `next` dist-tag of every pinned peer,
# then installs that line into a scratch copy of the checkout and runs
# `pnpm test` plus the composition boot test. A line that moves past a floor
# appends the exact version delta to the run summary — the signal to re-run the
# `docs/PEER-PARITY.md` comparison and raise the floor; a failing upgrade fails
# this run.
name: peer-canary

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Two canaries at once would produce two divergent canary-summary.md deltas.
concurrency:
  group: peer-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SHA-pinned like ci.yml's actions — this workflow installs the `next`
      # line of every peer, the exact place a mutated tag would do damage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # corepack, the same provisioning ci.yml uses (packageManager pins the
      # version); the third-party pnpm action goes away with it.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Resolve the next line and test it in a scratch tree
        run: node scripts/peer-canary.mjs --apply --tag next
      - name: Publish the delta table
        if: always()
        run: cat canary-summary.md >> "$GITHUB_STEP_SUMMARY" || true

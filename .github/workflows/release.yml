name: Release

# Pushing a `v<version>` tag publishes that version. The tag must match
# package.json, the gates must pass, and npm receives a provenance attestation
# tying the tarball to this workflow run and commit.
on:
  push:
    tags: ["v*"]

# `id-token: write` is what lets npm exchange this run's OIDC token for a
# short-lived publish credential (trusted publishing), so no npm token is stored in
# the repository. `contents: write` is for creating the GitHub Release.
permissions:
  contents: write
  id-token: write

# corepack resolves pnpm from the packageManager field; the flag silences its
# interactive download confirmation, which has no TTY in CI.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment in the repository settings to put a
    # second pair of eyes in front of every publish. The environment is created on
    # first use, so this does not block until you configure it.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      # The gates import pinned dev dependencies (the composition and boot tests
      # run the loader's real patch algorithm); `pnpm install --frozen-lockfile`
      # reproduces the locked tree.
      #
      # pnpm 11.7's lockfile supply-chain re-verification ignores the
      # `minimumReleaseAgeExclude` list in pnpm-workspace.yaml (the exact list
      # passed on the command line IS honored in small batches but behaves
      # erratically in bulk), so a fresh pin that is under 24h old fails the
      # install with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. The pins are
      # exact release candidates the maintainers choose deliberately — the
      # exclusion IS the policy — so install runs with the age window off;
      # the tarball-URL binding and trust checks stay active. Revisit when
      # pnpm reads the yaml list again.
      - name: Install
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Gates
        run: pnpm test && pnpm run test:coverage
      - name: Test shipped native agents
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt
          node agent/native/spike/test.mjs agent/native/linux-x86_64/dsh-wsl-agent
          node agent/native/spike/test.mjs agent/native/linux-aarch64/dsh-wsl-agent
      # Re-running a release after a partial failure must not end at a 409. Ask the
      # registry whether this version is already published, and skip the upload when
      # it is, so the job still gets to create the GitHub Release.
      - name: Is this version already on the registry?
        id: published
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "dsh-plugin-wsl-env@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "dsh-plugin-wsl-env@$version is already published; skipping the upload"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs the package configured for it on npmjs.com with
      # this repository, this workflow file and the `npm-publish` environment; see
      # docs/RELEASING.md. If that is not set up, add an NPM_TOKEN repository secret
      # and hand it to this step as `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        # A prerelease version must never move npm's `latest` tag — every
        # `npm install dsh-plugin-wsl-env` consumer would take the rc. The
        # tag↔version discipline lives in scripts/check-release-tag.mjs; the
        # dist-tag policy lives here.
        run: |
          version="$(node -p 'require("./package.json").version')"
          if echo "$version" | grep -qE -- '-(rc|alpha|beta|next)\.'; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
      # The step that used to be docs-only (RELEASING.md's registry
      # verification; skipping it is how the 0.1.1 README incident shipped):
      # the tarball's file count must match npm pack's, and the readme must
      # be the one on disk.
      - name: Verify what the registry now serves
        if: steps.published.outputs.exists != 'true'
        run: |
          version="$(node -p 'require("./package.json").version')"
          local_count="$(npm pack --dry-run --json --ignore-scripts 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].files.length')"
          # npm publishes before the version is resolvable: the upload prints
          # success while the packument still 404s for a minute or two (see
          # docs/RELEASING.md "Operational facts"). Poll instead of checking
          # once, or a healthy publish fails this step and skips the Release.
          served_count=""
          for attempt in 1 2 3 4 5 6 7 8; do
            served_count="$(npm view "dsh-plugin-wsl-env@$version" dist.fileCount --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            [ -n "$served_count" ] && break
            echo "attempt $attempt: version not resolvable yet; waiting 30s"
            sleep 30
          done
          [ -n "$served_count" ] || { echo "registry never served $version within 4 minutes" >&2; exit 1; }
          served_readme="$(npm view "dsh-plugin-wsl-env@$version" readmeFilename --registry=https://registry.npmjs.org/)"
          echo "tarball files: $local_count; registry serves: $served_count; readme: $served_readme"
          [ "$local_count" = "$served_count" ] || { echo "file-count mismatch — the tarball on the registry is not what npm pack built" >&2; exit 1; }
          [ "$served_readme" = "README.md" ] || { echo "readmeFilename is '$served_readme', expected README.md" >&2; exit 1; }
      - name: GitHub Release, notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs --out release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

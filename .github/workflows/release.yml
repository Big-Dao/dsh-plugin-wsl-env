name: Release

# Pushing a `v<version>` tag publishes that version. The tag must match
# package.json, the gates must pass, and npm receives a provenance attestation
# tying the tarball to this workflow run and commit.
#
# workflow_dispatch is the dry run: it packs the candidate and runs the official
# Harness smoke without publishing, so a release blocker like #68 can be
# exercised on demand instead of only being discovered by pushing a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The workflow default is read-only. Only the publish job raises it: `id-token:
# write` lets npm exchange that run's OIDC token for a short-lived publish
# credential (trusted publishing), so no npm token is stored in the repository,
# and `contents: write` creates the GitHub Release.
permissions:
  contents: read

# corepack resolves pnpm from the packageManager field; the flag silences its
# interactive download confirmation, which has no TTY in CI.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Packs the exact tagged commit once — on Linux, so the tarball's executable
  # bits survive (a Windows filesystem has no exec bit, and npm does not fix up
  # non-`bin` entries, which turned the shipped shell scripts into 0644; #69).
  # The tarball is uploaded as the `candidate-package` artifact, and publish
  # uploads those same bytes — the tarball is never repacked.
  pack-candidate:
    name: pack the candidate tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball-name: ${{ steps.pack.outputs.name }}
      tarball-integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Pack the candidate tarball (the only pack; publish uploads these bytes)
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p candidate-package
          # pack.json lands on disk (not a pipe): the publish job re-reads the
          # same identity, and a pipe hides npm's stderr from the failure log.
          npm pack --json --ignore-scripts --pack-destination candidate-package >candidate-package/pack.json
          file="$(node -p 'JSON.parse(require("fs").readFileSync("candidate-package/pack.json","utf8"))[0].filename')"
          integrity="$(node -p 'JSON.parse(require("fs").readFileSync("candidate-package/pack.json","utf8"))[0].integrity')"
          echo "candidate package@$version integrity $integrity"
          echo "name=$file" >>"$GITHUB_OUTPUT"
          echo "integrity=$integrity" >>"$GITHUB_OUTPUT"
      - name: Keep the exact candidate tarball and pack identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-package
          path: candidate-package/
          if-no-files-found: error
  # Installs the candidate tarball into the pinned official Harness on Windows
  # before anything is published. Publish needs this job (through pack), so a
  # failing candidate blocks the release; the logs are kept as an artifact.
  candidate-package-smoke:
    name: candidate package smoke (official Harness)
    needs:
      - pack-candidate
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Harness compatibility floor; keep in step with docs/PEER-PARITY.md.
      DSH_OFFICIAL_HARNESS_VERSION: "0.2.2-rc.2"
      DSH_WSL_ENV_DISTRO: ${{ vars.DSH_WSL_ENV_DISTRO || 'Ubuntu-24.04' }}
      DSH_WSL_ENV_PROFILE: ${{ vars.DSH_WSL_ENV_PROFILE || 'wsl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Download the candidate tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-package
          path: candidate-package
      - name: Provision the distro and WSL prerequisites
        uses: ./.github/actions/provision-wsl
        with:
          distro: ${{ env.DSH_WSL_ENV_DISTRO }}
      - name: Official Harness smoke
        env:
          DSH_PLUGIN_PACKAGE_TARBALL: ${{ github.workspace }}\candidate-package\${{ needs.pack-candidate.outputs.tarball-name }}
        run: pnpm run smoke:official-harness
      - name: Keep the smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: official-harness-smoke-logs
          path: test/probe/.scratch/
          include-hidden-files: true
          if-no-files-found: error
  # The full source gate is read-only and deliberately separate from publish:
  # it executes test code, installs Chromium and (through apt) qemu, so it must
  # not run beside `contents: write` / `id-token: write`. Defining it as its own
  # job also starts it at the same time as the Windows smoke instead of after
  # that job's 45-minute ceiling, so a red test is known early (#87).
  gates:
    name: source gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      # The browser gate needs a downloaded browser; --with-deps installs its
      # shared libraries on the hosted runner.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Gates
        run: pnpm test && pnpm run test:coverage && pnpm run test:browser
      - name: Test shipped native agents
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt
          node agent/native/spike/test.mjs agent/native/linux-x86_64/dsh-wsl-agent
          node agent/native/spike/test.mjs agent/native/linux-aarch64/dsh-wsl-agent
  publish:
    name: publish and release
    # A manual dispatch is the candidate smoke's dry run: it stops before any
    # publish or release step. Only a tag push publishes.
    if: github.event_name == 'push'
    needs:
      - candidate-package-smoke
      - pack-candidate
      - gates
    runs-on: ubuntu-latest
    # Publishing plus the registry read-back is far below this; the 10-minute
    # propagation window used to share a 15-minute budget with the source
    # gates, which made a slow but successful publish look like a timeout
    # (#87). Gates now live in their own job.
    timeout-minutes: 20
    # The environment is npm's trusted-publishing binding (repository + workflow
    # file + environment) and the audit anchor for each run. Required reviewers
    # are deliberately NOT configured: this is a single-maintainer repository and
    # the owner accepted tag-push auto-publish; see docs/RELEASING.md.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # corepack before setup-node: the cache flag below needs pnpm
      # resolvable (see ci.yml's test job).
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
      - name: Tag matches the package version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      # The source gates (installing the pinned dev dependencies, tests,
      # coverage, browser and native agents) run in the read-only `gates` job.
      # Keeping them out of this job is what lets publish stay a
      # checksum-and-upload step with only write permissions; the scripts used
      # here need Node builtins only.
      # The bytes that passed the smoke are the bytes that ship: download the
      # candidate tarball packed once on Linux (no repack) and require its
      # sha512 integrity and pack metadata to equal the pack job's outputs.
      - name: Download the candidate tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-package
          path: candidate-package
      - name: Candidate tarball matches the smoke candidate
        id: candidate
        env:
          CANDIDATE_NAME: ${{ needs.pack-candidate.outputs.tarball-name }}
          CANDIDATE_INTEGRITY: ${{ needs.pack-candidate.outputs.tarball-integrity }}
        run: |
          [ -n "$CANDIDATE_NAME" ] && [ -n "$CANDIDATE_INTEGRITY" ] || { echo "candidate outputs missing" >&2; exit 1; }
          file="candidate-package/$CANDIDATE_NAME"
          [ -f "$file" ] || { echo "candidate tarball missing: $file" >&2; exit 1; }
          integrity="sha512-$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)"
          [ "$integrity" = "$CANDIDATE_INTEGRITY" ] || { echo "integrity mismatch: $integrity != $CANDIDATE_INTEGRITY" >&2; exit 1; }
          [ "$(node -p 'JSON.parse(require("fs").readFileSync("candidate-package/pack.json","utf8"))[0].integrity')" = "$CANDIDATE_INTEGRITY" ] || { echo "pack.json integrity mismatch" >&2; exit 1; }
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "count=$(node -p 'JSON.parse(require("fs").readFileSync("candidate-package/pack.json","utf8"))[0].files.length')" >>"$GITHUB_OUTPUT"
      # Re-running a release after a partial failure must not end at a 409. Ask the
      # registry whether this version is already published, and skip the upload when
      # it is, so the job still gets to create the GitHub Release. The integrity
      # check below still runs against what the registry serves.
      - name: Is this version already on the registry?
        id: published
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "dsh-plugin-wsl-env@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "dsh-plugin-wsl-env@$version is already published; skipping the upload"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs the package configured for it on npmjs.com with
      # this repository, this workflow file and the `npm-publish` environment; see
      # docs/RELEASING.md. If that is not set up, add an NPM_TOKEN repository secret
      # and hand it to this step as `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`.
      - name: Publish the candidate tarball
        if: steps.published.outputs.exists != 'true'
        # A prerelease version must never move npm's `latest` tag. Both the
        # tag/version discipline and the dist-tag policy live in
        # scripts/check-release-tag.mjs: `--dist-tag` answers `next` for ANY
        # prerelease segment, where the list of identifiers this step used to
        # grep for let `0.30.0-preview.1` through to `latest`. Publishing a
        # tarball path runs no lifecycle scripts, and the gates job has
        # already run the full chain.
        # The ./ prefix is load-bearing: a bare owner/name-shaped relative
        # path is parsed as a GitHub slug and npm dies in `git ls-remote`
        # (run 44929316601).
        env:
          CANDIDATE_FILE: ${{ steps.candidate.outputs.file }}
        run: |
          dist_tag="$(node scripts/check-release-tag.mjs --dist-tag)"
          npm publish "./$CANDIDATE_FILE" --provenance --access public --tag "$dist_tag"
      # Registry read-back (skipping it is how the 0.1.1 README incident
      # shipped): served dist.integrity must equal the candidate's. Runs for an
      # already-published version too, so a re-run never trusts stale bytes.
      - name: Verify what the registry serves
        env:
          CANDIDATE_INTEGRITY: ${{ needs.pack-candidate.outputs.tarball-integrity }}
          LOCAL_COUNT: ${{ steps.candidate.outputs.count }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          served_count=""
          served_integrity=""
          # Registry propagation has taken ~6 minutes (0.26.0); 10 minutes
          # leaves room before the release is declared failed.
          for attempt in $(seq 1 20); do
            served_count="$(npm view "dsh-plugin-wsl-env@$version" dist.fileCount --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            served_integrity="$(npm view "dsh-plugin-wsl-env@$version" dist.integrity --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            [ -n "$served_count" ] && [ -n "$served_integrity" ] && break
            echo "attempt $attempt: version not resolvable yet; waiting 30s"
            sleep 30
          done
          [ -n "$served_count" ] && [ -n "$served_integrity" ] || { echo "registry never served $version within 10 minutes" >&2; exit 1; }
          served_readme="$(npm view "dsh-plugin-wsl-env@$version" readmeFilename --registry=https://registry.npmjs.org/)"
          echo "candidate integrity: $CANDIDATE_INTEGRITY"
          echo "served integrity:    $served_integrity"
          [ "$LOCAL_COUNT" = "$served_count" ] || { echo "file-count mismatch: candidate $LOCAL_COUNT, registry $served_count" >&2; exit 1; }
          [ "$CANDIDATE_INTEGRITY" = "$served_integrity" ] || { echo "integrity mismatch: the registry's tarball is not the smoke candidate" >&2; exit 1; }
          [ "$served_readme" = "README.md" ] || { echo "readmeFilename is '$served_readme', expected README.md" >&2; exit 1; }
      - name: GitHub Release, notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs --out release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
  # Re-checks what npm actually serves: downloads the exact published version
  # (never `latest` or a dist tag), proves its integrity equals the registry's,
  # and runs the official-Harness smoke against it. Failure never rolls the
  # release back; it opens an issue and appends a warning to the Release notes.
  post-release-package-smoke:
    name: post-release-package-smoke (official Harness)
    if: github.event_name == 'push'
    needs:
      - publish
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    env:
      DSH_OFFICIAL_HARNESS_VERSION: "0.2.2-rc.2"
      DSH_WSL_ENV_DISTRO: ${{ vars.DSH_WSL_ENV_DISTRO || 'Ubuntu-24.04' }}
      DSH_WSL_ENV_PROFILE: ${{ vars.DSH_WSL_ENV_PROFILE || 'wsl' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Download the published package
        id: fetch
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          served_integrity=""
          pack_json=""
          # Registry metadata and the tarball blob propagate on separate
          # schedules: metadata can be visible minutes before `npm pack`
          # stops 404ing (run 44930348477's v0.28.0). One window polls both.
          for attempt in $(seq 1 20); do
            served_integrity="$(npm view "dsh-plugin-wsl-env@$version" dist.integrity --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            if [ -z "$served_integrity" ]; then
              echo "attempt $attempt: dsh-plugin-wsl-env@$version not resolvable yet; waiting 30s"
              sleep 30
              continue
            fi
            rm -rf "$RUNNER_TEMP/published"
            mkdir -p "$RUNNER_TEMP/published"
            if pack_json="$(npm pack "dsh-plugin-wsl-env@$version" --json --registry=https://registry.npmjs.org/ --pack-destination "$RUNNER_TEMP/published" 2>/dev/null)"; then
              break
            fi
            echo "attempt $attempt: metadata is visible but the tarball is not served yet; waiting 30s"
            sleep 30
          done
          [ -n "$served_integrity" ] && [ -n "$pack_json" ] || { echo "registry never served dsh-plugin-wsl-env@$version" >&2; exit 1; }
          file="$(printf '%s' "$pack_json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename')"
          integrity="$(printf '%s' "$pack_json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].integrity')"
          echo "registry integrity: $served_integrity"
          echo "tarball integrity:  $integrity"
          [ "$integrity" = "$served_integrity" ] || { echo "integrity mismatch: downloaded tarball differs from the registry" >&2; exit 1; }
          echo "DSH_PLUGIN_PACKAGE_TARBALL=$RUNNER_TEMP/published/$file" >>"$GITHUB_ENV"
      - name: Provision the distro and WSL prerequisites
        uses: ./.github/actions/provision-wsl
        with:
          distro: ${{ env.DSH_WSL_ENV_DISTRO }}
      - name: Official Harness smoke on the published package
        run: pnpm run smoke:official-harness
      - name: Keep the smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: post-release-package-smoke-logs-${{ github.ref_name }}
          path: test/probe/.scratch/
          include-hidden-files: true
          if-no-files-found: error
      # GitHub Release warning and issue: the package is never reported healthy
      # when its post-release smoke did not pass.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          warning="> **Warning:** post-release-package-smoke failed for dsh-plugin-wsl-env@$version. This published package is NOT verified against the official Harness. Run: $run_url"
          title="post-release-package-smoke failed for $GITHUB_REF_NAME"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$warning"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$warning"
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body >release-body.md
          printf '\n\n%s\n' "$warning" >>release-body.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-body.md

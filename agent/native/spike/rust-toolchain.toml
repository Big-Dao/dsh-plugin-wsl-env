# Pins the toolchain the spike (and therefore the shipped
# agent/native/linux-*/dsh-wsl-agent binaries) builds with, so CI, release
# verification and local builds produce the same bytes instead of drifting
# with runner images. 1.99.1 is the version the committed binaries were last
# built and qemu-tested with (rustup fetches it on first use — the runner
# image's preinstalled stable is ignored). The targets list removes the need
# for a separate `rustup target add` in the CI native-package job.
[toolchain]
channel = "1.99.1"
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#FFFFFF"/>

  <text x="470" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">DSH Desktop for Windows —— 没有本插件时</text>
  <text x="470" y="56" text-anchor="middle" font-size="12.5" fill="#6B7280">两种模式都没有 POSIX 执行环境：Windows 工作区落在 CMD / PowerShell，WSL 工作区靠 wsl.exe 逐条包装</text>

  <rect x="40" y="78" width="860" height="322" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="56" y="102" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="0.5">WINDOWS 宿主</text>

  <rect x="60" y="114" width="820" height="104" rx="8" fill="#FFFFFF" stroke="#60A5FA"/>
  <text x="76" y="138" font-size="13" font-weight="700" fill="#1E3A8A">DeepSeek Harness Desktop</text>
  <text x="76" y="160" font-size="12.5" fill="#374151">GUI——对话 · 文件树 · 预览 · 终端面板</text>
  <text x="76" y="180" font-size="12.5" fill="#374151">模型调用（LLM API 流量）</text>
  <text x="76" y="200" font-size="12.5" fill="#374151">配置与会话状态——<tspan font-family="ui-monospace, Consolas, monospace" font-size="12">%USERPROFILE%\.dsh</tspan></text>

  <rect x="60" y="234" width="402" height="152" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="76" y="258" font-size="13" font-weight="700" fill="#B91C1C">Windows 工作区：命令运行在 CMD / PowerShell</text>
  <text x="76" y="284" font-size="11.5" fill="#7F1D1D">✗ 模型训练语料以 POSIX 为主——</text>
  <text x="76" y="306" font-size="11.5" fill="#7F1D1D">✗ 生成的 CMD / PowerShell 脚本容易出错</text>
  <text x="76" y="328" font-size="11.5" fill="#7F1D1D">✗ nvm、cargo、pyenv 与 rc 文件全部不生效</text>
  <text x="76" y="352" font-size="11.5" fill="#B91C1C" font-weight="700">模型最擅长的语言，在这里行不通</text>

  <rect x="478" y="234" width="402" height="152" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="494" y="258" font-size="13" font-weight="700" fill="#B45309">WSL 工作区：每条命令套一层 wsl.exe</text>
  <text x="494" y="284" font-size="11.5" fill="#92400E">✗ 每行命令都要带 wsl.exe 前缀</text>
  <text x="494" y="306" font-size="11.5" fill="#92400E">✗ 每次调用都是孤立空间——环境、cwd 与</text>
  <text x="508" y="324" font-size="11.5" fill="#92400E">进程状态无法跨调用保持</text>
  <text x="494" y="348" font-size="11.5" fill="#92400E">✗ 多步脚本在接缝处断掉</text>
  <text x="494" y="372" font-size="11.5" fill="#B45309" font-weight="700">有状态的工作撑不过这层包装</text>

  <line x1="470" y1="404" x2="470" y2="460" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="486" y="422" font-size="12" fill="#374151" font-family="ui-monospace, Consolas, monospace">文件工具读取 \wsl.localhost\ubuntu\…</text>
  <text x="486" y="442" font-size="12" fill="#6B7280">9p 共享——每次读 / 写 / 搜索一个慢往返，</text>
  <text x="486" y="460" font-size="12" fill="#6B7280">没有原生的 Linux 文件语义</text>

  <rect x="40" y="468" width="860" height="88" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="56" y="492" font-size="12" font-weight="700" fill="#15803D" letter-spacing="0.5">WSL 2 发行版（LINUX 虚机）</text>
  <text x="76" y="516" font-size="12.5" fill="#374151">项目在这里：ext4 · 发行版自己的 rg · git hooks · dev server</text>
  <text x="76" y="538" font-size="12" fill="#9CA3AF">模型脚本唯一跑得好的地方——执行却从未到达</text>
</svg>

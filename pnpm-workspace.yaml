allowBuilds:
  esbuild: true
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true

# undici rides in as an exact transitive pin of @deepseek-ai/dsh-http-proxy,
# which upstream controls; the security advisories against 8.11.x are fixed in
# 8.12.3, so the lockfile carries the override until upstream moves the pin.
overrides:
  undici: '>=8.12.3'

# pnpm's release-age policy refuses a package published inside the window. The
# peer pins name one exact release candidate, so pnpm records the whole closure
# it had to exempt; the list moves with the pins, as pnpm rewrites it.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/dsh-agent@0.2.1-rc.2'
  - '@deepseek-ai/dsh-api-workspace-files@0.2.1-rc.2'
  - '@deepseek-ai/dsh-bash-local@0.2.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.2'
  - '@deepseek-ai/dsh-deque@0.2.1-rc.2'
  - '@deepseek-ai/dsh-fs-local@0.2.1-rc.2'
  - '@deepseek-ai/dsh-fs-sandbox@0.2.1-rc.2'
  - '@deepseek-ai/dsh-fs@0.2.1-rc.2'
  - '@deepseek-ai/dsh-host-directory-picker@0.2.1-rc.2'
  - '@deepseek-ai/dsh-http-proxy@0.2.1-rc.2'
  - '@deepseek-ai/dsh-lazy-require@0.2.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.2'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.1-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.2.1-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session@0.2.1-rc.2'
  - '@deepseek-ai/dsh-shell@0.2.1-rc.2'
  - '@deepseek-ai/dsh-subprocess-local@0.2.1-rc.2'
  - '@deepseek-ai/dsh-subprocess@0.2.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.2'
  - '@deepseek-ai/dsh-win32-process@0.2.1-rc.2'

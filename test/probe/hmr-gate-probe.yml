# HMR update gate overlay. Generated by test/probe/hmr-gate.sh; do not edit the
# generated copy. It overrides the manager's Git connection check (the default
# 5 s leaves a slow GitHub connection looking like a failed update) and inserts
# the probe row that drives `updateBundle` or reads the restart providers.
#
# TEMPLATE: hmr-gate.sh substitutes @MODE@, @NAME@, @VERSION@, @SPEC@,
# @WORKSPACE@, @REPORT@, and @PROBE@ into a generated copy.
- id: plugin-manager
  config:
    githubConnectionTimeoutMs: 30000
- insert:
    - id: hmr-gate-probe
      name: '@PROBE@'
      config:
        mode: @MODE@
        name: '@NAME@'
        version: '@VERSION@'
        spec: '@SPEC@'
        workspace: '@WORKSPACE@'
        report: '@REPORT@'

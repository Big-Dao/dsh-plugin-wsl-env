# Terminal probe overlay — applied on top of the throwaway `wslfs` profile.
#
# Replaces the composition-level subprocess provider with the WSL one and mounts
# the probe beside it, so the boot exercises exactly what the GUI terminal
# window resolves: `agent.ctx.get("subprocess")` at the root realm.
#
# This file is a TEMPLATE: `cwd` is the UNC spelling of this checkout and `expectPwd`
# is the Linux path the provider must translate it into, so both depend on the machine
# (the distro name and the checkout location). `test/probe/terminal.sh` substitutes
# @WORKSPACE_UNC@ and @WORKSPACE_LINUX@ into a generated copy beside it
# (`.generated-terminal-probe.yml`, gitignored) and applies that.
- id: subprocess
  disabled: true

- insert:
    - id: subprocess-wsl
      name: 'dsh-plugin-wsl-env/subprocess'
      config:
        distro: ''

    - id: terminal-probe
      name: './terminal-probe.mjs'
      config:
        cwd: '@WORKSPACE_UNC@'
        expectPwd: @WORKSPACE_LINUX@

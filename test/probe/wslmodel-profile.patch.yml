# wslmodel — a headless, WSL-only profile used to verify the filesystem
# mutation path through a REAL model turn (archived record §16.5 / §10).
#
# It is the shipped `headless` template with every host provider replaced by the
# WSL one, so the only environment the model can see is the distro:
#
#   * the three sandboxing executors are disabled (a low-integrity Windows token
#     cannot reach WSL at all — archived record §2.1);
#   * `dsh-plugin-wsl-env` provides ctx.shell and `dsh-plugin-wsl-env/fs` ctx.fs;
#   * the shell/file tool rows are flipped to the bash/file pair, since headless
#     has no agent preset to do that selection.
#
#   dsh --profile wslmodel --json "<task>"
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-account
    model: deepseek-flash

- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
# The permission presets exist to switch a CONFINED executor between sandbox
# modes. The WSL executor is confined now — distro-side bubblewrap — so this row
# would activate; it is disabled because this bench drives one mode and does not
# need the selector.
#
# Note when running it: the session workspace is the policy's workspace root, so
# a bench started from a Windows directory is fenced to THAT directory, and a
# write to a distro path is refused by design. Use a workspace inside the distro
# (a UNC path, as the GUI does) to exercise distro writes.
- id: permission
  disabled: true

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- insert:
    - id: wsl-shell
      name: 'dsh-plugin-wsl-env'
      config:
        distro: ''   # empty: WSL's default distro
        cwd: ''   # empty: the distro user's home
        loginShell: true
    - id: wsl-fs
      name: 'dsh-plugin-wsl-env/fs'
      config:
        distro: ''   # empty: WSL's default distro
        cwd: ''   # empty: the distro user's home
        restrictToDistro: true
        resolveSymlinks: true
